aid: clyde

name: Clyde

image: https://joinclyde.com/og-image.jpg

description: Clyde provides ownership enrichment solutions that help businesses drive lifetime value and revenue through extended warranty and
  product protection plans. Now part of Cover Genius, Clyde offers registration, resolution, and partnership tools for merchants to engage customers,
  automate issue resolution, and unlock cost savings. The platform includes documentation, a developer portal, and various integration points
  for insurance and warranty services.

